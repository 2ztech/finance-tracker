; Production hardening for the Apache/PHP image.
; The base image loads no php.ini, so these override PHP's permissive defaults.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; PHP2Shell (CVE-2026-109619) entry vector; recommend disabling even when patched.
session.upload_progress.enabled = 0

; Reject attacker-supplied session IDs.
session.use_strict_mode = 1
